<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>Painéis de Clientes · Escritório</title><link rel="icon" href="__AV__">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--navy:#1B3A6B;--deep:#11264A;--gold:#C8A44A;--bg:#F3F5F9;--panel:#fff;--fg:#18233A;--muted:#5C6B85;--line:#DCE2EC;--cream:#FFF8E7;--crit:#B42318;--crit-bg:#FDECEA;--ok:#1E7A4C;--ok-bg:#E3F4EA}
@media (prefers-color-scheme:dark){:root{--bg:#0C1322;--panel:#141E33;--fg:#E6EBF4;--muted:#9AA8C2;--line:#26334D;--cream:#1A2640;--crit:#F97066;--crit-bg:#3A1714;--ok:#5DD39E;--ok-bg:#12301F;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.5}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.lock{position:fixed;inset:0;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(1200px 600px at 20% 0%,#244B86 0%,var(--navy) 35%,#0B1B36 100%)}
.card{background:#fff;color:#18233A;border-radius:14px;padding:30px 26px;width:100%;max-width:400px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}.brand img{width:44px;height:44px;border-radius:10px}
.brand b{display:block}.brand span{font-size:12px;color:#5C6B85}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:24px;margin:0 0 6px}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5C6B85;margin:16px 0 6px}
input{width:100%;font-family:"IBM Plex Mono",monospace;font-size:20px;letter-spacing:.25em;text-align:center;padding:12px;border:1.5px solid #CBD3E1;border-radius:8px;background:#F7F9FC;color:#18233A;text-transform:uppercase}
button{font:inherit;cursor:pointer}.btn{margin-top:14px;width:100%;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:12px;font-weight:600}
.err{color:#B42318;font-size:13px;min-height:20px;margin-top:10px}
header{background:linear-gradient(120deg,var(--deep),var(--navy));color:#fff;padding:22px max(16px,env(safe-area-inset-left,0px))}
header .in,main{max-width:1100px;margin:0 auto}header .eyebrow{color:var(--gold);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
header h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:28px;margin:4px 0 2px}header p{margin:0;color:#C9D5EA;font-size:13px}
main{padding:22px max(16px,env(safe-area-inset-left,0px)) 40px;display:flex;flex-direction:column;gap:16px}
.client{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}.top h3{margin:0;font-size:18px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}.crit{background:var(--crit-bg);color:var(--crit)}.ok{background:var(--ok-bg);color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.k{background:var(--cream);border-radius:8px;padding:10px 12px}.k b{display:block;font-family:Fraunces,Georgia,serif;font-size:24px}.k span{font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:8px 12px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.row dt{color:var(--muted);font-size:12.5px}.row dd{margin:0;overflow-wrap:anywhere}
.copy{background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:4px 10px;font-size:12px}
.note{font-size:12.5px;color:var(--muted)}a{color:#2B5BA8}
@media (max-width:600px){.row{grid-template-columns:minmax(0,1fr)}.copy{justify-self:start}}
</style></head><body>
<div class="lock" id="lock"><form class="card" id="f" autocomplete="off">
<div class="brand"><img src="__AV__" alt="Fevereiro &amp; Cruz"><div><b>Fevereiro &amp; Cruz</b><span>Uso interno do escritório</span></div></div>
<h1>Painéis de clientes</h1><p style="margin:0;color:#5C6B85;font-size:13.5px">Acesso restrito à equipe. Digite o código mestre.</p>
<label for="code">Código mestre</label><input id="code" type="password" maxlength="12" autocomplete="off" spellcheck="false" required>
<button class="btn" id="b" type="submit">Entrar</button><div class="err" id="e" role="alert"></div></form></div>
<div id="app" hidden><header><div class="in"><div class="eyebrow">Visão do escritório</div><h2>Painéis de clientes</h2><p id="upd"></p></div></header><main id="m"></main></div>
<script type="application/json" id="payload">__P__</script>
<script>
(function(){"use strict";
const P=JSON.parse(document.getElementById('payload').textContent),b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const el=(t,a,...k)=>{const n=document.createElement(t);if(a)for(const[x,v]of Object.entries(a)){if(x==='class')n.className=v;else if(x.startsWith('on'))n.addEventListener(x.slice(2),v);else n.setAttribute(x,v)}for(const c of k.flat())if(c!=null)n.append(c.nodeType?c:document.createTextNode(String(c)));return n};
const f=document.getElementById('f'),i=document.getElementById('code'),e=document.getElementById('e'),b=document.getElementById('b');
i.addEventListener('input',()=>{i.value=i.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);e.textContent=''});
f.addEventListener('submit',async ev=>{ev.preventDefault();b.disabled=true;b.textContent='Verificando…';
try{const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(i.value),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
const D=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},k,b64(P.ct))));
i.value='';document.getElementById('lock').hidden=true;document.getElementById('app').hidden=false;render(D);
}catch(x){e.textContent='Código incorreto.'}finally{b.disabled=false;b.textContent='Entrar'}});
function copyBtn(t){return el('button',{class:'copy',type:'button',onclick:async ev=>{try{await navigator.clipboard.writeText(t);ev.target.textContent='Copiado'}catch(_){ev.target.textContent='Selecione e copie'}setTimeout(()=>ev.target.textContent='Copiar',1600)}},'Copiar')}
function render(D){document.getElementById('upd').textContent='Atualizado em '+D.atualizado;const m=document.getElementById('m');
for(const p of D.paineis){m.append(el('section',{class:'client'},
 el('div',{class:'top'},el('h3',null,p.cliente),p.criticas?el('span',{class:'pill crit'},p.criticas+' ocorrência crítica em aberto'):el('span',{class:'pill ok'},'Sem ocorrências críticas')),
 el('div',{class:'kpis'},[['Marcas',p.marcas],['Processos INPI',p.processos],['Ocorrências digitais',p.ocorrencias],['Críticas e altas',p.criticas+p.altas],['Notificações em curso',p.notifAbertas]].map(([l,v])=>el('div',{class:'k'},el('b',null,String(v)),el('span',null,l)))),
 el('dl',{class:'row'},el('dt',null,'Link do painel'),el('dd',null,el('a',{href:p.link,target:'_blank',rel:'noopener noreferrer'},p.link)),copyBtn(p.link)),
 el('dl',{class:'row'},el('dt',null,'Código do cliente'),el('dd',{class:'mono'},p.codigo),copyBtn(p.codigo)),
 el('dl',{class:'row'},el('dt',null,'Contato'),el('dd',null,p.contato),el('span')),
 el('dl',{class:'row'},el('dt',null,'Última atualização'),el('dd',null,p.ultima+' · varredura digital em '+p.varredura),el('span')),
 el('dl',{class:'row'},el('dt',null,'Rotina'),el('dd',null,p.rotina),el('span')),
 el('dl',{class:'row'},el('dt',null,'Fontes'),el('dd',null,p.fontes.join(' · ')),el('span')),
 p.alt?el('dl',{class:'row'},el('dt',null,p.alt.nome),el('dd',null,el('a',{href:p.alt.link,target:'_blank',rel:'noopener noreferrer'},p.alt.link),' · PIN ',el('span',{class:'mono'},p.alt.codigo)),copyBtn(p.alt.link)):null,
 p.obs?el('p',{class:'note',style:'margin:0'},'Pendência: '+p.obs):null))}
m.append(el('p',{class:'note'},'Envie link e código ao cliente por canais diferentes. Para revogar um acesso, peça um código novo: o anterior deixa de funcionar na próxima publicação.'))}
})();
</script></body></html>
